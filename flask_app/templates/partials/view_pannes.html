    <!-- VUE 2 : PANNES & INTERVENTIONS -->
    <div id="view-pannes" class="view-panel hidden">
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
          <h2 class="text-base font-bold text-slate-800">Historique et Suivi des Pannes Techniques</h2>
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full lg:w-auto">
            <div class="relative w-full sm:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="pannes-search-input" oninput="applyPanneFilters()" placeholder="Rechercher équipement, panne, utilisateur..." class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <button type="button" id="panne-filter-all" onclick="setPanneFilter('ALL')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-900 text-white">Tous</button>
              <button type="button" id="panne-filter-EP" onclick="setPanneFilter('EP')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">En panne</button>
              <button type="button" id="panne-filter-ER" onclick="setPanneFilter('ER')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">En réparation</button>
              <button type="button" id="panne-filter-RP" onclick="setPanneFilter('RP')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">Réparé</button>
              <button type="button" id="panne-filter-IR" onclick="setPanneFilter('IR')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">Irréparable</button>
              <button onclick="openNewPanneModal()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Déclarer une nouvelle panne
              </button>
            </div>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200">
              <tr>
                <th class="p-3 min-w-[130px]">Date</th>
                <th class="p-3 min-w-[150px]">Matériel</th>
                <th class="p-3 min-w-[160px]">N° Inventaire / Série</th>
                <th class="p-3 min-w-[170px]">Diagnostic & Panne</th>
                <th class="p-3 min-w-[150px]">Utilisateur assigné</th>
                <th class="p-3 min-w-[160px]">Technicien / Lieu</th>
                <th class="p-3 min-w-[145px]">Statut</th>
                <th class="p-3 text-right min-w-[160px]">Actions</th>
              </tr>
              <tr class="bg-white border-b border-slate-200">
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-date" type="text" oninput="applyPanneFilters()" placeholder="Filtrer date..." aria-label="Filtrer par date" class="w-full min-w-[95px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-materiel" type="text" oninput="applyPanneFilters()" placeholder="Filtrer matériel..." aria-label="Filtrer par matériel" class="w-full min-w-[110px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-inventaire" type="text" oninput="applyPanneFilters()" placeholder="N° inv. ou série..." aria-label="Filtrer par numéro d'inventaire ou série" class="w-full min-w-[110px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-diagnostic" type="text" oninput="applyPanneFilters()" placeholder="Filtrer diagnostic..." aria-label="Filtrer par diagnostic et panne" class="w-full min-w-[120px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-utilisateur" type="text" oninput="applyPanneFilters()" placeholder="Filtrer utilisateur..." aria-label="Filtrer par utilisateur assigné" class="w-full min-w-[110px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1"><input id="pannes-filter-technicien" type="text" oninput="applyPanneFilters()" placeholder="Filtrer technicien/lieu..." aria-label="Filtrer par technicien ou lieu" class="w-full min-w-[115px] rounded border border-slate-300 px-2 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500"></th>
                <th class="px-2 pb-3 pt-1">
                  <select id="pannes-filter-statut" onchange="applyPanneFilters()" aria-label="Filtrer par statut" class="w-full min-w-[120px] rounded border border-slate-300 bg-white px-1.5 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="ALL">Tous les statuts</option>
                    <option value="EP">En panne</option>
                    <option value="ER">En réparation</option>
                    <option value="RP">Réparé</option>
                    <option value="IR">Irréparable</option>
                    <option value="PROPOSEE">Proposé réforme</option>
                    <option value="REFORME">Réformé</option>
                  </select>
                </th>
                <th class="px-2 pb-3 pt-1">
                  <select id="pannes-filter-actions" onchange="applyPanneFilters()" aria-label="Filtrer par actions disponibles" class="w-full min-w-[125px] rounded border border-slate-300 bg-white px-1.5 py-1.5 text-[11px] font-normal normal-case focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="ALL">Toutes les actions</option>
                    <option value="REPARER">Avec « Réparé »</option>
                    <option value="SANS_REPARER">Sans « Réparé »</option>
                  </select>
                </th>
              </tr>
            </thead>
            <tbody id="pannes-table-body" class="divide-y divide-slate-100">
              <!-- Rempli dynamiquement -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
