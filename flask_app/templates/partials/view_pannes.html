    <!-- VUE 2 : PANNES & INTERVENTIONS -->
    <div id="view-pannes" class="view-panel hidden">
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
          <h2 class="text-base font-bold text-slate-800">Historique et Suivi des Pannes Techniques</h2>
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full lg:w-auto">
            <div class="relative w-full sm:w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="pannes-search-input" oninput="applyPanneFilters()" placeholder="Rechercher équipement, panne, utilisateur..." class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <button type="button" id="panne-filter-all" onclick="setPanneFilter('ALL')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-900 text-white">Tous</button>
              <button type="button" id="panne-filter-EP" onclick="setPanneFilter('EP')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">En panne</button>
              <button type="button" id="panne-filter-ER" onclick="setPanneFilter('ER')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">En réparation</button>
              <button type="button" id="panne-filter-RP" onclick="setPanneFilter('RP')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">Réparé</button>
              <button type="button" id="panne-filter-IR" onclick="setPanneFilter('IR')" class="panne-filter-btn px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200">Irréparable</button>
              <button onclick="openNewPanneModal()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Déclarer une nouvelle panne
              </button>
            </div>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200">
              <tr>
                <th class="p-3">Date</th>
                <th class="p-3">Matériel</th>
                <th class="p-3">N° Inventaire / Série</th>
                <th class="p-3">Diagnostic & Panne</th>
                <th class="p-3">Utilisateur assigné</th>
                <th class="p-3">Technicien / Lieu</th>
                <th class="p-3">Statut</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="pannes-table-body" class="divide-y divide-slate-100">
              <!-- Rempli dynamiquement -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
