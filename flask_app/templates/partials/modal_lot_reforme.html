  <!-- MODAL : NOUVEAU LOT DE RÉFORME -->
  <div id="modal-lot-reforme" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-amber-600"></i> Nouveau lot de réforme
        </h3>
        <button onclick="closeModal('modal-lot-reforme')" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleSaveLotReforme(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">N° de lot *</label>
          <input type="text" id="lot-reforme-val" required placeholder="Ex : LOT-2026-001"
                 class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Description / Observation</label>
          <input type="text" id="lot-reforme-desc" placeholder="Description du lot"
                 class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-amber-500">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal('modal-lot-reforme')"
                  class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">
            Annuler
          </button>
          <button type="submit"
                  class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold shadow-sm">
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>
