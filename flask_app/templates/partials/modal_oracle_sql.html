  <!-- MODAL : SCRIPT SQL D'EXPORT ORACLE -->

    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div>
          <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-code text-rose-600"></i> Script SQL d'extraction Oracle

          <p class="text-xs text-slate-500 mt-0.5">Exécutez ce script dans SQL*Plus ou SQL Developer pour extraire les données en JSON direct.</p>

          <button onclick="copyOracleSqlScript()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow">

          <button onclick="closeModal('modal-oracle-sql')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">Fermer</button>

      </div>
    </div>
