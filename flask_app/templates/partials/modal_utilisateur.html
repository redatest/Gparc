  <!-- MODAL : AJOUT / MODIFICATION D'UTILISATEUR -->
  <div id="modal-utilisateur" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 id="utilisateur-modal-title" class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-user text-indigo-600"></i> Nouvel utilisateur</h3>
        <button onclick="closeModal('modal-utilisateur')" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleSaveUtilisateur(event)" class="mt-4 space-y-4">
        <input type="hidden" id="utilisateur-id">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom *</label>
            <input type="text" id="utilisateur-nom" list="utilisateurs-noms-list" oninput="checkUtilisateurAutocomplete('nom')" required maxlength="100" autocomplete="off" class="w-full px-3 py-2 border rounded-lg text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Prénom *</label>
            <input type="text" id="utilisateur-prenom" list="utilisateurs-prenoms-list" oninput="checkUtilisateurAutocomplete('prenom')" required maxlength="100" autocomplete="off" class="w-full px-3 py-2 border rounded-lg text-xs">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail</label>
          <input type="email" id="utilisateur-mail" list="utilisateurs-emails-list" oninput="checkUtilisateurAutocomplete('email')" maxlength="200" autocomplete="off" class="w-full px-3 py-2 border rounded-lg text-xs">
        </div>
        <datalist id="utilisateurs-noms-list"></datalist>
        <datalist id="utilisateurs-prenoms-list"></datalist>
        <datalist id="utilisateurs-emails-list"></datalist>
        <div id="utilisateur-duplicate-warning" class="hidden rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800"></div>
        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Structure de rattachement</label><select id="utilisateur-structure" class="w-full px-3 py-2 border rounded-lg text-xs"><option value="">Aucune structure</option></select></div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal('modal-utilisateur')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
