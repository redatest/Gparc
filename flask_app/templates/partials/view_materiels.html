    <!-- VUE MATÉRIELS : PARC ÉQUIPEMENTS / PARC INFORMATIQUE -->
    <div id="view-materiels" class="view-panel space-y-4">

<!-- Barre de Recherche et Filtres -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:w-96">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" oninput="applyFilters()" placeholder="Rechercher par N° inv, série, utilisateur, modèle..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto">
          <button onclick="setFilter('ALL')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Tous</button>
          <button onclick="setFilter('ES')" id="filter-es" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition">En service</button>
          <button onclick="setFilter('PR')" id="filter-pr" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Proposé à la réforme</button>
          <button onclick="setFilter('RF')" id="filter-rf" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Réformé</button>
        </div>
      </div>


      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-desktop text-blue-600"></i> Parc des Équipements Informatiques
              </h2>
              <span id="materiels-count-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">0 équipements</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">Inventaire complet, spécifications techniques, affectations et statut en temps réel.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openNewMaterielModal()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition">
              <i class="fa-solid fa-plus"></i> Nouvel Équipement
            </button>
          </div>
        </div>

        <div id="materiels-pagination-top" class="px-4 py-3 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div id="materiels-pagination-info-top" class="text-xs text-slate-500"></div>
          <div class="flex items-center gap-1.5">
            <label for="materiels-page-size-top" class="text-xs text-slate-500 mr-1">Afficher</label>
            <select id="materiels-page-size-top" onchange="changeMaterielsPageSize(this.value)" class="px-2 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-700">
              <option value="10">10</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="text-xs text-slate-500 mr-2">par page</span>
            <button onclick="changeMaterielsPage(-1)" class="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="materiels-page-number-top" class="px-2 text-xs font-semibold text-slate-700"></span>
            <button onclick="changeMaterielsPage(1)" class="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead class="bg-slate-50 text-slate-600 uppercase font-semibold border-b border-slate-200">
              <tr>
                <th class="p-3">Équipement</th>
                <th class="p-3">N° Inventaire / Série</th>
                <th class="p-3">Affectation (Utilisateur & Structure)</th>
                <th class="p-3">Spécifications (CPU / RAM / Disque / SE)</th>
                <th class="p-3">Structure</th>
                <th class="p-3">Statut</th>
                <th class="p-3">État</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="materiels-table-body" class="divide-y divide-slate-100">
              <!-- Rempli dynamiquement -->
            </tbody>
          </table>
        </div>
        <div id="materiels-pagination" class="px-4 py-3 border-t border-slate-200 bg-slate-50 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div id="materiels-pagination-info" class="text-xs text-slate-500"></div>
          <div class="flex items-center gap-1.5">
            <label for="materiels-page-size" class="text-xs text-slate-500 mr-1">Afficher</label>
            <select id="materiels-page-size" onchange="changeMaterielsPageSize(this.value)" class="px-2 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-700">
              <option value="10">10</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="text-xs text-slate-500 mr-2">par page</span>
            <button onclick="changeMaterielsPage(-1)" id="materiels-page-prev" class="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="materiels-page-number" class="px-2 text-xs font-semibold text-slate-700"></span>
            <button onclick="changeMaterielsPage(1)" id="materiels-page-next" class="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
