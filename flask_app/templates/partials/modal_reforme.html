  <!-- MODAL : DÉCLARER UNE RÉFORME -->
  <div id="modal-reforme" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-recycle text-amber-600"></i> Déclarer une réforme</h3>
        <button onclick="closeModal('modal-reforme')" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleSaveReforme(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Équipement concerné *</label>
          <select id="reforme-mat-id" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500"></select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">État de l'équipement *</label>
            <select id="reforme-etat" onchange="updateReformeDeclarationFields()" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
              <option value="AUCUNE">En service</option>
              <option value="PROPOSEE">Proposé à la réforme</option>
              <option value="REFORME">Réformé</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Date de réforme</label>
            <input type="date" id="reforme-date" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
          </div>
        </div>
        <div id="reforme-identification-fields" class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Année de réforme *</label>
            <input type="number" id="reforme-annee" min="2000" max="2100" placeholder="ex. 2026" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">N° de lot *</label>
            <select id="reforme-lot" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
              <option value="">Sélectionner un N° de lot...</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Motif de réforme</label>
          <textarea id="reforme-motif" rows="4" placeholder="Saisissez le motif de la réforme..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500"></textarea>
        </div>
        <div class="rounded-lg border border-slate-200 bg-slate-50 p-3">
          <div class="text-xs font-semibold text-slate-700 mb-2">Raccourcis du motif</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer">
              <input type="checkbox" id="reforme-motif-irreparable" onchange="updateReformeMotif()" class="w-4 h-4 rounded border-slate-300 text-amber-600 focus:ring-amber-500">
              <span>Irréparable</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer">
              <input type="checkbox" id="reforme-motif-obsolete" onchange="updateReformeMotif()" class="w-4 h-4 rounded border-slate-300 text-amber-600 focus:ring-amber-500">
              <span>Obsolète</span>
            </label>
          </div>
        </div>
        <div class="rounded-lg bg-slate-50 border border-slate-200 p-3 text-xs text-slate-500"><i class="fa-solid fa-circle-info mr-1"></i> Le statut sélectionné sera immédiatement appliqué à l'équipement dans le parc.</div>
        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="closeModal('modal-reforme')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold shadow-sm">Enregistrer la réforme</button>
        </div>
      </form>
    </div>
  </div>
