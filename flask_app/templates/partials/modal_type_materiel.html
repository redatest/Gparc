  <!-- MODAL : AJOUT / MODIFICATION DE TYPE DE MATÉRIEL -->
  <div id="modal-type-materiel" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 id="type-materiel-modal-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-desktop text-indigo-600"></i> Nouveau type de matériel
        </h3>
        <button onclick="closeModal('modal-type-materiel')" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleSaveTypeMateriel(event)" class="mt-4 space-y-4">
        <input type="hidden" id="type-materiel-id">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Code type *</label>
          <input type="text" id="type-materiel-code" required maxlength="50" placeholder="ex: PC, IMP, SRV"
                 class="w-full px-3 py-2 border rounded-lg text-xs uppercase focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Libellé *</label>
          <input type="text" id="type-materiel-libelle" required maxlength="200" placeholder="ex: Ordinateur, Imprimante, Serveur"
                 class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal('modal-type-materiel')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
