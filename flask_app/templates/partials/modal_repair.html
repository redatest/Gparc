  <!-- MODAL : TRAITEMENT DE LA PANNE -->
  <div id="modal-repair" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-screwdriver-wrench text-indigo-600"></i> Traitement de la panne</h3>
        <button onclick="closeModal('modal-repair')" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="repair-equipment-info" class="mt-4 rounded-lg border border-indigo-100 bg-indigo-50/50 px-4 py-3">
        <div class="text-xs font-bold text-indigo-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-desktop"></i> Équipement concerné</div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-x-4 gap-y-2 text-xs">
          <div><div class="text-slate-400">Type</div><div id="repair-info-type" class="font-semibold text-slate-800">-</div></div>
          <div><div class="text-slate-400">Marque</div><div id="repair-info-brand" class="font-semibold text-slate-800">-</div></div>
          <div><div class="text-slate-400">Modèle</div><div id="repair-info-model" class="font-semibold text-slate-800">-</div></div>
          <div><div class="text-slate-400">N° de série</div><div id="repair-info-serial" class="font-semibold text-slate-800 font-mono">-</div></div>
          <div><div class="text-slate-400">Utilisateur assigné</div><div id="repair-info-user" class="font-semibold text-slate-800">-</div></div>
        </div>
      </div>
      <form onsubmit="handleRepairConfirmation(event)" class="mt-4 space-y-4">
        <input type="hidden" id="repair-panne-id">
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-semibold text-slate-700 mb-1">Date d'envoi à la réparation</label><input type="date" id="repair-date-send" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></div>
          <div><label class="block text-xs font-semibold text-slate-700 mb-1">Lieu de réparation</label><select id="repair-lieu" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"><option value="">Sélectionner un lieu...</option></select></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-semibold text-slate-700 mb-1">Date de retour de la réparation</label><input type="date" id="repair-date-return" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></div>
          <div><label class="block text-xs font-semibold text-slate-700 mb-1">État actuel de la panne</label><select id="repair-state" onchange="setRepairStateFields()" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"><option value="EP">En panne</option><option value="ER">En réparation</option><option value="RP">Réparé</option><option value="IR">Irréparable</option></select></div>
        </div>
        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Détail de la réparation</label><textarea id="repair-detail" rows="4" placeholder="Décrivez les travaux réalisés, les contrôles effectués, les pièces remplacées..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea><p class="text-[11px] text-slate-400 mt-1">Ce contenu alimente le champ « Détail de la réparation » de la fiche d'intervention.</p></div>
        <div><label class="block text-xs font-semibold text-slate-700 mb-2">Observation</label><textarea id="repair-observation" rows="2" placeholder="A laisser pour le feedback utilisateur..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" disabled></textarea></div>
        <div class="rounded-lg border border-slate-200 bg-slate-50 p-3">
          <div class="text-xs font-semibold text-slate-700 mb-2">Raccourcis d'observation</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer"><input type="checkbox" id="repair-obs-ras" onchange="updateRepairObservation()" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"><span>R.A.S</span></label>
            <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer"><input type="checkbox" id="repair-obs-remis" onchange="updateRepairObservation()" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"><span>Réparé et remis en service</span></label>
            <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer"><input type="checkbox" id="repair-obs-piece" onchange="updateRepairObservation()" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"><span>Pièce de rechange introuvable</span></label>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="closeModal('modal-repair')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">Annuler</button><button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm"><i class="fa-solid fa-floppy-disk mr-1"></i> Enregistrer le traitement</button></div>
      </form>
    </div>
  </div>
