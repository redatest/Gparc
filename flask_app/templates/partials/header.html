  <!-- En-tête de navigation -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo & Titre -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('materiels')">
          <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white font-bold text-lg">
            <i class="fa-solid fa-server"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">GPARC</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Serveur Flask & SQLite Actifs
              </span>
            </div>
            <p class="text-xs text-slate-400 font-medium">Gestion du Parc Informatique & Pannes</p>
          </div>
        </div>

        <!-- Actions rapides d'en-tête -->
        <div class="flex items-center gap-3">
          <button onclick="openNewMaterielModal()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Nouveau Matériel</span>
          </button>
          <button onclick="openNewPanneModal()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white transition shadow-sm">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Signaler Panne</span>
          </button>
          <button onclick="loadAllData()" title="Rafraîchir" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
          </button>
        </div>
      </div>

      <!-- Onglets de navigation -->
      <nav class="flex space-x-1 border-t border-slate-800 py-1.5 overflow-x-auto">
        <button onclick="switchView('materiels')" id="tab-materiels" class="nav-tab px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-desktop"></i> Parc Informatique
        </button>
        <button onclick="switchView('pannes')" id="tab-pannes" class="nav-tab px-3 py-1 rounded text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-wrench"></i> Pannes & Interventions
        </button>
        <span id="panne-nav-count" title="Équipements en panne" class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 rounded-full bg-rose-600 text-white text-[11px] font-bold leading-none shadow-sm">0</span>
        <span id="reparation-nav-count" title="Équipements en réparation" class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 rounded-full bg-amber-500 text-white text-[11px] font-bold leading-none shadow-sm">0</span>
        <button onclick="switchView('reformes')" id="tab-reformes" class="nav-tab px-3 py-1 rounded text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-recycle"></i> Réforme
        </button>
        <button onclick="switchView('parametres')" id="tab-parametres" class="nav-tab px-3 py-1 rounded text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-sliders text-indigo-400"></i> Paramètres
        </button>
        <button onclick="switchView('stats')" id="tab-stats" class="nav-tab px-3 py-1 rounded text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-chart-pie"></i> Statistiques
        </button>
        <button onclick="switchView('oracle')" id="tab-oracle" class="nav-tab px-3 py-1 rounded text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-database text-rose-400"></i> Import Oracle
        </button>
        <button onclick="resetData()" class="nav-tab ml-auto px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-rose-300 hover:bg-rose-950/40 border border-slate-800 flex items-center gap-1 whitespace-nowrap">
          <i class="fa-solid fa-rotate-left"></i> Réinitialiser Démo
        </button>
      </nav>
    </div>
  </header>
