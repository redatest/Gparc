  <!-- MODAL : NOUVEAU / MODIFICATION DE SYSTÈME D'EXPLOITATION -->
  <div id="modal-se" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 id="se-modal-title" class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-brands fa-windows text-indigo-600"></i> Nouveau système d'exploitation</h3>
        <button onclick="closeModal('modal-se')" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleSaveSe(event)" class="mt-4 space-y-4">
        <input type="hidden" id="se-param-id">
        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Système d'exploitation *</label><input type="text" id="se-param-val" required maxlength="200" placeholder="Ex : Windows 11 Pro 64-bit" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-indigo-500"></div>
        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Description</label><input type="text" id="se-param-desc" maxlength="300" placeholder="Description / utilisation" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-indigo-500"></div>
        <div><label class="block text-xs font-semibold text-slate-700 mb-1">Ordre d'affichage</label><input type="number" id="se-param-ordre" min="1" value="1" class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-indigo-500"></div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100"><button type="button" onclick="closeModal('modal-se')" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">Annuler</button><button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow">Enregistrer</button></div>
      </form>
    </div>
  </div>
