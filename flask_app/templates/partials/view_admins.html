<!-- Administration des comptes : super administrateur uniquement -->
<section id="view-admins" class="view-panel hidden space-y-6">
  <div class="bg-white p-5 rounded-xl border border-slate-200">
    <div class="flex flex-wrap justify-between items-start gap-3 border-b border-slate-200 pb-4">
      <div><h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-user-shield text-indigo-600 mr-2"></i>Administration des comptes</h2>
      <p class="text-xs text-slate-500 mt-1">Création et gestion des administrateurs autorisés à accéder à GPARC.</p></div>
    </div>
    <form id="admin-create-form" class="grid grid-cols-1 md:grid-cols-4 gap-3 py-4 border-b border-slate-100">
      <input id="admin-full-name" type="text" placeholder="Nom complet" required class="w-full">
      <input id="admin-username" type="text" placeholder="Identifiant" minlength="3" required class="w-full">
      <input id="admin-password" type="password" placeholder="Mot de passe (10 caractères min.)" minlength="10" required class="w-full">
      <button class="btn-flat-primary px-4 py-2" type="submit"><i class="fa-solid fa-plus mr-1"></i> Créer l'administrateur</button>
    </form>
    <div id="admins-feedback" class="hidden text-sm p-3 rounded mb-3"></div>
    <div class="overflow-x-auto"><table class="w-full text-left text-xs">
      <thead><tr><th class="p-3">Nom complet</th><th class="p-3">Identifiant</th><th class="p-3">Rôle</th><th class="p-3">État</th><th class="p-3 text-right">Actions</th></tr></thead>
      <tbody id="admins-table-body"><tr><td colspan="5" class="p-5 text-center text-slate-400">Chargement...</td></tr></tbody>
    </table></div>
  </div>
</section>
